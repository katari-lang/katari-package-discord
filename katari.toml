[package]
name = "discord"
version = "0.8.0"
description = "A discord.js client for Katari: a bot-token provider (nothing is connected at the provider, and every call takes the token, so a runtime restart costs only the interrupted call — re-fork the watcher and it serves the channel again), the message plane (watch / send / read-the-gap, with files in every direction — `try_send` answers with its OUTCOME, `delivered | dropped(reason)`, so a dropped post is never reported as a sent one, and `list_messages` reads the channel's own history after a message id, so the gateway's misses are recoverable by a bot that kept a cursor), and `ask` — one blocking question that presents its controls as data and returns the answer as data. Plus the four things every bot was writing for itself: Discord's caps as data (`limits`, including the message-text cap an ask's prompt is bound by), a pure local check of a question before it is asked (`check_controls`), a truncation that fits a message and says so (`fit_message`), and a keyed pseudonym for a speaker's snowflake (`author_tag`). Ships an FFI sidecar (discord.ts)."

[runtime]
url = "http://localhost:3000"

# The sidecar's source root defaults to [package].src ("src"), where discord.ts lives alongside
# discord.ktr, so no explicit [sidecar] section is needed — `katari apply` bundles it into the
# consumer's snapshot.

[dependencies]
registry = "https://raw.githubusercontent.com/katari-lang/katari-registry/main"
snapshot = "staging"
packages = []
