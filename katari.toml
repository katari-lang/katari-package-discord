[package]
name = "discord"
version = "0.10.0"
description = "A discord.js client for Katari: a bot-token provider (nothing is connected at the provider, and every call takes the token — and `watch_messages` supervises itself as of 0.10.0: a runtime restart's interruption replays it onto a fresh credential resolve with capped backoff, while a typed `auth_error` still stops it loudly, `discord_watch` remaining the mortal form), the message plane (watch / send / read-the-gap, with files in every direction — `try_send` answers with its OUTCOME, `delivered | dropped(reason)`, so a dropped post is never reported as a sent one, and `list_messages` reads the channel's own history after a message id, so the gateway's misses are recoverable by a bot that kept a cursor), and `ask` — one blocking question that presents its controls as data and returns the answer as data. Plus the two things only this package can know: Discord's caps as data (`limits`, including the message-text cap an ask's prompt is bound by) and a pure local check of a question before it is asked (`check_controls`). The truncation and the keyed pseudonym went back to the prelude in 0.9.0 — `string.fit(value, cap = limits().message_text, marker)` and `crypto.pseudonym(key, value)` — because neither judgement was about Discord. Ships an FFI sidecar (discord.ts)."

[runtime]
url = "http://localhost:3000"

# The sidecar's source root defaults to [package].src ("src"), where discord.ts lives alongside
# discord.ktr, so no explicit [sidecar] section is needed — `katari apply` bundles it into the
# consumer's snapshot.

[dependencies]
registry = "https://raw.githubusercontent.com/katari-lang/katari-registry/main"
snapshot = "staging"
packages = []
